; UsbHost example for CoreS3. Wi-Fi and console credentials come from the environment at build time:
;   WIFI_SSID=... WIFI_PASSWORD=... M5LINK_PASSWORD=... pio run -t upload --upload-port <name>.local
; The first upload has to go over USB in download mode (hold reset for about 2 s); later ones can use OTA.

[env:cores3]
platform = espressif32@6.9.0
board = m5stack-cores3
framework = arduino
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
  -DWIFI_PASSWORD=\"${sysenv.WIFI_PASSWORD}\"
  -DCONSOLE_PASSWORD=\"${sysenv.M5LINK_PASSWORD}\"
build_unflags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  m5-link=symlink://../..
  m5stack/M5Unified@0.2.29
  m5stack/M5GFX@0.2.36
