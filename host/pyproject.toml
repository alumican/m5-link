[project]
name = "m5-link"
version = "0.4.0"
description = "Host side of m5-link: logs and typed input over USB serial or Wi-Fi, and HTTP requests for an M5Stack over USB"
license = "MIT"
authors = [{ name = "Yukiya Okuda" }]
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[project.scripts]
m5-link = "m5_link.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m5_link"]
