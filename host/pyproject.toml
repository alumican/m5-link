[project]
name = "usblink"
version = "0.1.0"
description = "マイコン（UsbLink）を USB でつないで、頼まれた HTTP を代わりにする。Wi-Fi のない場所で使う"
license = "MIT"
authors = [{ name = "Yukiya Okuda" }]
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[project.scripts]
usblink = "usblink.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usblink"]
